<!DOCTYPE html>
<html lang="en" oncontextmenu="return false" ondragstart="return false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Designs/config.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="nav">
        <div class="nav-left">
            <h2 class="nav-title">GoRecipe</h2>
        </div>
        <div class="nav-right">
            <button class="nav-btns">History</button>
            <button class="nav-btns">How it works</button>
            <button class="nav-btns"><i class="fa-brands fa-github"></i></button>
        </div>
    </div>
    <main class="container">
        <div class="container-title">
            <h1>Welcome to GoRecipe</h1>
            <p>Search your favorite recipes, all in one place!</p>
            <div class="container-search">
                <div class="container-search-title">
                    <h3>Find Your Perfect Recipe</h3>
                </div>
                <div class="search">
                    <input class="search-bar" name="search" id="search-bar" type="text" placeholder="e.g., Adobo, Sinigang, Beef Steak...">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
        </div>
        <div class="container-result">
            <div class="result-box">
                <h3>Search Results</h3>
                <p>Search for your favorite recipes and find them here!</p>
                <div class="result">
                    <p class="searh-text" id="text-result"></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
